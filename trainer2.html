<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#00247d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Taiwan-Trainer · Englisch & Mandarin</title>

<!-- Design sofort setzen (verhindert kurzes Aufblitzen) -->
<script>
(function(){
  var t = localStorage.getItem('twTrainerTheme') || 'auto';
  var dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
})();
</script>

<style>
  :root {
    --red:#c8102e; --blue:#00247d;
    --accent:#00247d; --accent-text:#00247d;
    --bg:#f4f6fb; --card:#ffffff; --text:#222; --muted:#555;
    --border:#cfd3dc; --btn:#ffffff; --panel-border:transparent;
    --tipbg:#fff7e0; --badgebg:#e8ecfa; --barbg:#e0e0e0;
    --ok:#1e8e3e; --bad:#d93025; --warn:#f29900;
    --shadow:0 2px 8px rgba(0,0,0,.08);
    color-scheme: light;
  }
  [data-theme="dark"] {
    --accent:#4f6be8; --accent-text:#9db0ff;
    --bg:#111318; --card:#1c1f26; --text:#e8eaed; --muted:#a3a8b2;
    --border:#3a3f4a; --btn:#262a33; --panel-border:#2a2e37;
    --tipbg:#2d2818; --badgebg:#252d4a; --barbg:#2f333c;
    --ok:#2e9d4f; --bad:#e0483d; --warn:#f5b041;
    --shadow:none;
    color-scheme: dark;
  }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; line-height:1.4;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
    background:var(--bg); color:var(--text);
    padding-bottom:env(safe-area-inset-bottom);
    transition:background .2s, color .2s;
  }

  /* ---------- Kopfbereich ---------- */
  header {
    background:linear-gradient(90deg,var(--blue),var(--red)); color:#fff;
    padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top));
  }
  .hwrap { max-width:760px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  header h1 { margin:0; font-size:1.3rem; }
  .sub { font-size:.85rem; opacity:.9; }
  .icon {
    background:rgba(255,255,255,.2); border:none; color:#fff; font-size:1.3rem;
    width:44px; height:44px; min-height:44px; border-radius:50%; padding:0; flex-shrink:0;
  }

  /* ---------- Layout ---------- */
  main {
    max-width:760px; margin:16px auto;
    padding:0 max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
  }
  .panel {
    background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px;
    box-shadow:var(--shadow); border:1px solid var(--panel-border);
  }

  /* ---------- Einstellungen (einklappbar) ---------- */
  details.panel > summary {
    cursor:pointer; font-weight:700; list-style:none; min-height:28px;
    display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px;
  }
  summary::-webkit-details-marker { display:none; }
  summary::after { content:'▾'; margin-left:auto; transition:transform .2s; }
  details[open] > summary::after { transform:rotate(180deg); }
  details[open] > summary { margin-bottom:12px; }
  #sumtxt { font-weight:400; font-size:.85rem; color:var(--muted); }
  details[open] #sumtxt { display:none; }

  .row { display:grid; grid-template-columns:90px 1fr; gap:8px; align-items:center; margin-bottom:10px; }
  .row > label { font-weight:600; }
  .seg { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:6px; }

  /* ---------- Bedienelemente ---------- */
  button, select, input {
    font:inherit; font-size:1rem; padding:10px 12px; min-height:44px;
    border-radius:10px; border:1px solid var(--border);
    background:var(--btn); color:var(--text);
  }
  select { width:100%; }
  button { cursor:pointer; touch-action:manipulation; transition:background .15s, transform .05s, border-color .15s; }
  button:active { transform:scale(.97); }
  button:disabled { cursor:default; }
  button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.primary { background:var(--red); color:#fff; border-color:var(--red); }
  @media (hover:hover) {
    button:not(.active):not(.primary):not(.correct):not(.wrong):not(:disabled):hover { border-color:var(--accent-text); }
  }

  /* ---------- Lernkarte ---------- */
  .card {
    min-height:260px; display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align:center; touch-action:pan-y;
  }
  .prompt { font-size:1.5rem; font-weight:600; margin:12px 0; overflow-wrap:anywhere; }
  .answer { font-size:1.3rem; color:var(--accent-text); margin:10px 0; overflow-wrap:anywhere; }
  .say { min-height:40px; padding:4px 10px; margin-left:6px; vertical-align:middle; }
  .tip {
    font-size:.92rem; background:var(--tipbg); border-left:4px solid var(--warn);
    padding:10px; margin-top:10px; text-align:left; width:100%; border-radius:6px;
  }
  #ans, #actions { width:100%; }
  .options { display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; margin-top:10px; }
  .options button { text-align:left; min-height:52px; }
  .grade { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:420px; margin:12px auto 0; }
  .big { width:100%; max-width:320px; margin-top:12px; font-weight:600; }
  .correct { background:var(--ok)!important; color:#fff!important; border-color:var(--ok)!important; }
  .wrong   { background:var(--bad)!important; color:#fff!important; border-color:var(--bad)!important; }
  .feedback { font-weight:600; margin-top:10px; }
  .hint { font-size:.8rem; color:var(--muted); margin-top:10px; }
  input.type { width:100%; margin-top:12px; font-size:16px; }

  /* ---------- Statistik ---------- */
  .stats { display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 12px; font-size:.9rem; color:var(--muted); }
  .bar { height:8px; background:var(--barbg); border-radius:4px; overflow:hidden; margin-top:8px; }
  .bar div { height:100%; background:var(--ok); transition:width .3s; }
  .badge { font-size:.75rem; background:var(--badgebg); color:var(--accent-text); padding:3px 10px; border-radius:10px; }

  .actions { display:flex; flex-wrap:wrap; gap:8px; }
  .actions button { flex:1 1 200px; }

  /* ---------- Handy ---------- */
  @media (max-width:600px) {
    header h1 { font-size:1.1rem; }
    .sub { font-size:.75rem; }
    main { margin-top:10px; }
    .panel { padding:12px; border-radius:12px; margin-bottom:10px; }
    .row { grid-template-columns:1fr; gap:4px; }
    .options { grid-template-columns:1fr; }
    .prompt { font-size:1.3rem; }
    .answer { font-size:1.15rem; }
    .card { min-height:52vh; }
  }
  @media (prefers-reduced-motion:reduce) { * { transition:none!important; } }
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div>
      <h1>🇹🇼 Taiwan-Trainer</h1>
      <div class="sub">Englisch &amp; Mandarin · Schule · Alltag · Taiwan</div>
    </div>
    <button id="themeBtn" class="icon" aria-label="Design wechseln">🌓</button>
  </div>
</header>

<main>
  <details class="panel" id="settings" open>
    <summary>⚙️ Einstellungen <span id="sumtxt"></span></summary>

    <div class="row"><label>Bereich</label>
      <div class="seg">
        <button data-set="phrases" class="active">Phrasen</button>
        <button data-set="vocab">Wortschatz</button>
      </div>
    </div>

    <div class="row"><label for="cat">Thema</label>
      <select id="cat">
        <option value="all">Alle Themen</option>
        <option value="Schule">Schule</option>
        <option value="Alltag">Alltag</option>
        <option value="Taiwan">Taiwan</option>
        <option value="Mandarin">Mandarin (Grundwortschatz)</option>
      </select>
    </div>

    <div class="row"><label>Modus</label>
      <div class="seg">
        <button data-mode="flash" class="active">🃏 Karten</button>
        <button data-mode="mc">☑️ Auswahl</button>
        <button data-mode="type">✍️ Schreiben</button>
      </div>
    </div>

    <div class="row"><label>Richtung</label>
      <div class="seg">
        <button data-dir="de-en" class="active">DE → EN</button>
        <button data-dir="en-de">EN → DE</button>
      </div>
    </div>
  </details>

  <section class="panel">
    <div class="stats">
      <span id="pos"></span><span id="score"></span><span id="mastery"></span>
    </div>
    <div class="bar"><div id="bar"></div></div>
  </section>

  <section class="panel card" id="card"></section>

  <section class="panel actions">
    <button id="restart">🔀 Neu mischen</button>
    <button id="reset">♻️ Lernstand zurücksetzen</button>
  </section>
</main>

<script src="phrases.js"></script>
<script src="vocab.js"></script>
<script>
// ================== Daten & Zustand ==================
const DATA = {
  phrases: PHRASES.map(([en,de,cat,tip]) => ({en,de,cat,tip,id:'p:'+en})),
  vocab:   VOCAB.map(([en,de,cat])       => ({en,de,cat,id:'v:'+en}))
};
const STORE = 'twTrainerProgress';
const THEME = 'twTrainerTheme';
let progress = JSON.parse(localStorage.getItem(STORE) || '{}');

const S = { set:'phrases', cat:'all', mode:'flash', dir:'de-en',
            queue:[], idx:0, right:0, done:0, answered:false, flipped:false, opts:[] };

const $ = id => document.getElementById(id);
const TOUCH = window.matchMedia('(pointer: coarse)').matches;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ================== Design (hell/dunkel) ==================
const mq = window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  const t = localStorage.getItem(THEME) || 'auto';
  const dark = t === 'dark' || (t === 'auto' && mq.matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  $('themeBtn').textContent = {auto:'🌓', dark:'🌙', light:'☀️'}[t];
  $('themeBtn').title = 'Design: ' + {auto:'automatisch', dark:'dunkel', light:'hell'}[t];
}
$('themeBtn').onclick = () => {
  const order = ['auto','dark','light'];
  const t = localStorage.getItem(THEME) || 'auto';
  localStorage.setItem(THEME, order[(order.indexOf(t)+1) % order.length]);
  applyTheme();
};
if (mq.addEventListener) mq.addEventListener('change', applyTheme);
applyTheme();

// ================== Lernstand ==================
function save(){ localStorage.setItem(STORE, JSON.stringify(progress)); }
function lvl(item){ return progress[item.id] || 0; }
function setLvl(item, ok){
  progress[item.id] = Math.max(0, Math.min(5, lvl(item) + (ok ? 1 : -1)));
  save();
}
function haptic(ok){ if (navigator.vibrate) navigator.vibrate(ok ? 15 : [30,40,30]); }

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function pool(){ return DATA[S.set].filter(x => S.cat==='all' || x.cat===S.cat); }

function buildQueue(){
  // Niedrige Lernstufen werden häufiger eingeplant
  const q = [];
  pool().forEach(it => {
    const n = 3 - Math.min(2, Math.floor(lvl(it)/2));
    for(let i=0;i<n;i++) q.push(it);
  });
  S.queue = shuffle(q).filter((x,i,a) => i===0 || a[i-1]!==x).slice(0, 30);
  S.idx = 0; S.right = 0; S.done = 0;
  render();
}

function q(it){ return S.dir==='de-en' ? it.de : it.en; }
function a(it){ return S.dir==='de-en' ? it.en : it.de; }

// ================== Sprachausgabe ==================
function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const zh = text.match(/[\u3000-\u303f\u3400-\u9fff\uff00-\uffef]+/g);
  const u = new SpeechSynthesisUtterance(zh ? zh.join('') : text);
  u.lang = zh ? 'zh-TW' : 'en-US';
  u.rate = zh ? 0.75 : 0.9;
  speechSynthesis.speak(u);
}
function sayBtn(text){ return `<button class="say" data-say="${esc(text)}" aria-label="Vorlesen">🔊</button>`; }
document.addEventListener('click', e => {
  const b = e.target.closest('.say');
  if (b) speak(b.dataset.say);
});

// ================== Prüfen beim Schreiben ==================
function norm(s){
  return s.normalize('NFD').replace(/[\u0300-\u0307\u0309-\u036f]/g,'').normalize('NFC')
          .toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-zäöüß0-9 ]/g,'')
          .replace(/\s+/g,' ').trim();
}
function lev(a,b){
  const d = Array.from({length:a.length+1},(_,i)=>[i]);
  for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}

// ================== Anzeige ==================
function updateStats(){
  const p = pool();
  const mastered = p.filter(x => lvl(x) >= 4).length;
  $('pos').textContent = `Karte ${Math.min(S.idx+1,S.queue.length)} / ${S.queue.length}`;
  $('score').textContent = `Richtig: ${S.right} / ${S.done}`;
  $('mastery').textContent = `Sicher: ${mastered} / ${p.length}`;
  $('bar').style.width = (p.length ? mastered/p.length*100 : 0) + '%';
}
function updateSummary(){
  const act = k => document.querySelector(`[data-${k}].active`).textContent;
  $('sumtxt').textContent = `${act('set')} · ${$('cat').selectedOptions[0].text} · ${act('mode')} · ${act('dir')}`;
}

function render(){
  updateStats(); updateSummary();
  const card = $('card');
  S.answered = false; S.flipped = false;

  if(S.idx >= S.queue.length){
    const pct = S.done ? Math.round(S.right/S.done*100) : 0;
    card.innerHTML = `<div class="prompt">🎉 Runde beendet!</div>
      <div>Ergebnis: ${S.right} von ${S.done} (${pct} %)</div>
      <button class="primary big" id="newRound">Neue Runde</button>`;
    $('newRound').onclick = buildQueue;
    return;
  }

  const it = S.queue[S.idx];
  const head = `<span class="badge">${esc(it.cat)} · Stufe ${lvl(it)}/5</span>
    <div class="prompt">${esc(q(it))}${S.dir==='en-de' ? ' ' + sayBtn(it.en) : ''}</div>`;

  if(S.mode==='flash'){
    card.innerHTML = head + `<div id="ans"></div>
      <div id="actions">
        <button class="primary big" id="flip">Lösung zeigen</button>
        <div class="hint">${TOUCH ? 'Oder tippe auf die Karte' : 'Leertaste = umdrehen'}</div>
      </div>`;
    $('flip').onclick = flip;

  } else if(S.mode==='mc'){
    const others = shuffle(pool().filter(x => x!==it && x.cat===it.cat)).slice(0,3);
    S.opts = shuffle([it, ...others]);
    card.innerHTML = head + `<div class="options">${
      S.opts.map((o,i) => `<button data-i="${i}">${TOUCH ? '' : (i+1)+'. '}${esc(a(o))}</button>`).join('')
    }</div><div id="ans"></div>`;
    card.querySelectorAll('.options button').forEach(b => b.onclick = () => choose(+b.dataset.i));

  } else {
    card.innerHTML = head + `
      <input class="type" id="inp" placeholder="Deine Übersetzung …"
             autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
      <button class="primary big" id="chk">Prüfen</button><div id="ans"></div>`;
    const inp = $('inp');
    if(!TOUCH) inp.focus();
    const check = () => {
      if(S.answered){ next(); return; }
      if(!inp.value.trim()){ inp.focus(); return; }
      const user = norm(inp.value);
      const sols = a(it).split(/\s*[\/;]\s*/).map(norm);
      const dist = Math.min(...sols.map(s => lev(user, s)));
      const best = Math.min(...sols.map(s => s.length));
      const ok = dist === 0, near = !ok && dist <= Math.max(1, Math.floor(best*0.15));
      if(TOUCH) inp.blur();
      finish(ok||near, ok ? '✔ Perfekt!' : near ? '≈ Fast richtig – achte auf die Schreibweise.' : '✘ Nicht ganz.');
      $('chk').textContent = 'Weiter →';
    };
    $('chk').onclick = check;
    inp.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); check(); } };
  }
}

function reveal(it){
  return `<div class="answer">${esc(a(it))} ${sayBtn(it.en)}</div>
    ${it.tip ? `<div class="tip">💡 ${esc(it.tip)}</div>` : ''}`;
}

function flip(){
  if(S.flipped || S.mode!=='flash' || S.idx >= S.queue.length) return;
  S.flipped = true;
  const it = S.queue[S.idx];
  $('ans').innerHTML = reveal(it);
  $('actions').innerHTML = `
    <div class="grade">
      <button class="wrong" id="no">✘ Nochmal</button>
      <button class="correct" id="yes">✔ Gewusst</button>
    </div>
    <div class="hint">${TOUCH ? '← wischen: nochmal · wischen →: gewusst' : '← nochmal · → gewusst'}</div>`;
  $('yes').onclick = () => grade(true);
  $('no').onclick  = () => grade(false);
}

function choose(i){
  if(S.answered || !S.opts[i]) return;
  const it = S.queue[S.idx];
  const btns = [...$('card').querySelectorAll('.options button')];
  const ok = S.opts[i] === it;
  btns[i].classList.add(ok ? 'correct' : 'wrong');
  btns[S.opts.indexOf(it)].classList.add('correct');
  btns.forEach(b => b.disabled = true);
  finish(ok, ok ? '✔ Richtig!' : '✘ Leider falsch.');
}

// Gemeinsamer Abschluss für Auswahl- und Schreibmodus
function finish(ok, msg){
  S.answered = true;
  const it = S.queue[S.idx];
  setLvl(it, ok); S.done++; if(ok) S.right++;
  haptic(ok);
  $('ans').innerHTML =
    `<div class="feedback" style="color:var(--${ok ? 'ok' : 'bad'})">${msg}</div>` + reveal(it) +
    (S.mode==='mc'
      ? `<button class="primary big" id="nx">Weiter →</button>
         ${TOUCH ? '' : '<div class="hint">Enter = weiter</div>'}`
      : '');
  if(S.mode==='mc') $('nx').onclick = next;
  updateStats();
}

// Bewertung im Karteikartenmodus
function grade(ok){
  if(!S.flipped || S.answered) return;
  S.answered = true;
  setLvl(S.queue[S.idx], ok);
  S.done++; if(ok) S.right++;
  haptic(ok);
  next();
}

function next(){
  S.idx++;
  render();
  // Auf dem Handy: Karte wieder ins Bild holen, falls nach unten gescrollt
  const r = $('card').getBoundingClientRect();
  if(r.top < 0) $('card').scrollIntoView({behavior:'smooth', block:'start'});
}

// ================== Touch: Tippen & Wischen ==================
const cardEl = $('card');
let tx = null, ty = null;

cardEl.addEventListener('click', e => {
  if(S.mode==='flash' && !S.flipped && !e.target.closest('button, input')) flip();
});

cardEl.addEventListener('touchstart', e => {
  const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY;
  cardEl.style.transition = 'none';
}, {passive:true});

cardEl.addEventListener('touchmove', e => {
  if(tx===null || S.mode!=='flash' || !S.flipped) return;
  const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  if(Math.abs(dx) > Math.abs(dy)){
    cardEl.style.transform = `translateX(${dx*0.6}px) rotate(${dx/40}deg)`;
    cardEl.style.boxShadow = dx > 0 ? '0 0 0 3px var(--ok)' : '0 0 0 3px var(--bad)';
  }
}, {passive:true});

cardEl.addEventListener('touchend', e => {
  cardEl.style.transition = 'transform .2s, box-shadow .2s';
  cardEl.style.transform = '';
  cardEl.style.boxShadow = '';
  if(tx===null) return;
  const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  tx = ty = null;
  if(S.mode==='flash' && S.flipped && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)*1.5){
    grade(dx > 0);
  }
}, {passive:true});

// ================== Tastatur (PC) ==================
document.addEventListener('keydown', e => {
  if(e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.target.matches('input, select, textarea')) return;
  if(S.idx >= S.queue.length) return;

  if(S.mode==='flash'){
    if(e.key===' '){ e.preventDefault(); flip(); }
    else if(S.flipped && (e.key==='ArrowRight' || e.key==='1')) grade(true);
    else if(S.flipped && (e.key==='ArrowLeft'  || e.key==='2')) grade(false);
  } else if(S.mode==='mc'){
    if(!S.answered && /^[1-4]$/.test(e.key)) choose(+e.key - 1);
    else if(S.answered && e.key==='Enter'){ e.preventDefault(); next(); }
  }
});

// ================== Einstellungen ==================
const SETS = 'twTrainerSettings';
Object.assign(S, (({set,cat,mode,dir}) =>
  Object.fromEntries(Object.entries({set,cat,mode,dir}).filter(([,v]) => v))
)(JSON.parse(localStorage.getItem(SETS) || '{}')));

function saveSettings(){
  localStorage.setItem(SETS, JSON.stringify({set:S.set, cat:S.cat, mode:S.mode, dir:S.dir}));
}
function syncUI(){
  ['set','mode','dir'].forEach(k =>
    document.querySelectorAll(`[data-${k}]`).forEach(x => x.classList.toggle('active', x.dataset[k]===S[k])));
  $('cat').value = S.cat;
  if($('cat').value !== S.cat){ S.cat = 'all'; $('cat').value = 'all'; }
}

document.querySelectorAll('[data-set],[data-mode],[data-dir]').forEach(b => b.onclick = () => {
  const key = 'set' in b.dataset ? 'set' : 'mode' in b.dataset ? 'mode' : 'dir';
  S[key] = b.dataset[key];
  syncUI(); saveSettings();
  key==='set' ? buildQueue() : render();
});

$('cat').onchange = e => { S.cat = e.target.value; saveSettings(); buildQueue(); };

$('restart').onclick = buildQueue;
$('reset').onclick = () => {
  if(confirm('Wirklich den gesamten Lernstand löschen?')){
    progress = {}; save(); buildQueue();
  }
};

// ================== Start ==================
if(window.matchMedia('(max-width:600px)').matches) $('settings').open = false;
syncUI();
buildQueue();
</script>
</body>
</html>
